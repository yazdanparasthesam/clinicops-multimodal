name: Promote to Prod (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROMOTE to deploy prod'
        required: true

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - name: Guard
        run: test "${{ github.event.inputs.confirm }}" = "PROMOTE"
      - name: Deploy API prod
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_PROD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_PROD_APP_ID }}
        run: |
          pip install --user "fastapi[standard]"
          export PATH=$HOME/.local/bin:$PATH
          echo "Token set: $(echo $FASTAPI_CLOUD_TOKEN | cut -c1-8)*** AppID $FASTAPI_CLOUD_APP_ID"
          fastapi deploy --help | head -n 30
          # deploy backend dir (where app/main.py lives) with full UUID
          fastapi deploy backend --app-id $FASTAPI_CLOUD_APP_ID || \
          fastapi cloud deploy backend --app-id $FASTAPI_CLOUD_APP_ID || \
          FASTAPI_CLOUD_APP_ID=$FASTAPI_CLOUD_APP_ID fastapi deploy backend
          for i in 1 2 3 4 5 6; do curl -sf ${{ secrets.PROD_API_URL }}/healthz && break || sleep 10; done
          curl -sf ${{ secrets.PROD_API_URL }}/healthz | grep -q ok
      - name: Smoke prod
        run: BASE=${{ secrets.PROD_API_URL }} bash ops/smoke.sh ${{ secrets.PROD_API_URL }}
      - name: Deploy Web prod
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_PROD_TOKEN }} --yes
      - name: Verify prod
        run: curl -sf ${{ secrets.PROD_WEB_URL }}/ | grep -q "<title>" && curl -sf ${{ secrets.PROD_API_URL }}/healthz | grep -q ok
