receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
exporters:
  otlp/tempo:
    endpoint: tempo:3200
    tls: { insecure: true }
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
processors: { batch: {} }
service:
  pipelines:
    traces: { receivers: [otlp], processors: [batch], exporters: [otlp/tempo] }
    logs: { receivers: [otlp], processors: [batch], exporters: [loki] }
