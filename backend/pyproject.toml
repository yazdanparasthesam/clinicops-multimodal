[project]
name = "clinicops-backend"
version = "0.2.0"
description = "ClinicOps Multimodal backend — FastAPI + LangChain"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic[email]>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "PyJWT>=2.8",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "langchain-core>=0.3",
  "langchain>=1.0",
  "langgraph>=0.2",
  "langchain-google-genai>=2.0",
  "openpyxl>=3.1",
  "fpdf2>=2.7",
  "psycopg[binary]>=3.2",
  "PyYAML>=6.0",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "prometheus-fastapi-instrumentator>=7.0",
  "Pillow>=10.0",
  "passlib[bcrypt]>=1.7",
  "bcrypt==4.0.1",
  "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --ignore=tests/unit/test_generator.py --ignore=tests/unit/test_mapping.py --ignore=tests/unit/test_ai_mock.py --ignore=tests/unit/test_database_url.py --ignore=tests/unit/test_ingestion.py --ignore=tests/unit/test_telemetry.py --ignore=tests/unit/test_deadlines.py --ignore=tests/integration/test_lifecycle.py --ignore=tests/integration/test_auth.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
